<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok & GTA 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* Animated Gradient Angle */
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Floating Animated Glowing Navigation Bar */
    .nav-wrapper {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 2px;
      border-radius: 9999px;
      background: conic-gradient(
        from var(--angle),
        transparent 0deg,
        rgba(168, 85, 247, 0.2) 60deg,
        #a855f7 140deg,
        #ec4899 180deg,
        #38bdf8 240deg,
        transparent 310deg
      );
      animation: rotateBorder 4s linear infinite;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    @keyframes rotateBorder {
      0% {
        --angle: 0deg;
      }
      100% {
        --angle: 360deg;
      }
    }

    .nav-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(16px);
      padding: 6px 10px;
      border-radius: 9999px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      color: #ffffff;
    }

    .nav-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(236, 72, 153, 0.25));
      border: 1px solid #a855f7;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
    }

    /* Content Area */
    .content-area {
      width: 100vw;
      min-height: 100vh;
    }

    .view-panel {
      display: none;
      width: 100%;
    }

    .view-panel.active {
      display: block;
    }

    /* Raw Full Video & Image (Pointer events disabled to prevent pause/right-click) */
    .raw-media {
      width: 100vw;
      min-height: 100vh;
      display: block;
      object-fit: contain;
      background: #000000;
      pointer-events: none; /* Prevents clicking or pausing the video */
    }

    /* Hide any browser-specific media controls completely */
    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Top Floating Nav -->
  <div class="nav-wrapper">
    <nav class="nav-bar">
      <button class="nav-btn active" id="btn-tiktok" onclick="switchTab('tiktok')">
        <span>📱</span> TikTok
      </button>
      <button class="nav-btn" id="btn-gta" onclick="switchTab('gta')">
        <span>🚗</span> GTA 5
      </button>
    </nav>
  </div>

  <!-- Raw Media View -->
  <div class="content-area">
    <!-- TikTok Video Tab (Unpausable, seamless loop) -->
    <div class="view-panel active" id="view-tiktok">
      <video id="tiktok-vid" class="raw-media" autoplay loop muted playsinline disablePictureInPicture>
        <source src="tiktok%20preview.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- GTA 5 Image Tab -->
    <div class="view-panel" id="view-gta">
      <img class="raw-media" src="gta-5" alt="GTA 5 Screenshot" />
    </div>
  </div>

  <script>
    const tiktokVid = document.getElementById('tiktok-vid');

    // Ensure video always plays and never pauses
    window.addEventListener('DOMContentLoaded', () => {
      if (tiktokVid) {
        tiktokVid.play().catch(() => {});
      }
    });

    function switchTab(tabName) {
      const btnTiktok = document.getElementById('btn-tiktok');
      const btnGta = document.getElementById('btn-gta');
      const viewTiktok = document.getElementById('view-tiktok');
      const viewGta = document.getElementById('view-gta');

      if (tabName === 'tiktok') {
        btnTiktok.classList.add('active');
        btnGta.classList.remove('active');
        viewTiktok.classList.add('active');
        viewGta.classList.remove('active');
        tiktokVid.play().catch(() => {});
      } else {
        btnGta.classList.add('active');
        btnTiktok.classList.remove('active');
        viewGta.classList.add('active');
        viewTiktok.classList.remove('active');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok & GTA 5 Full View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Rotating Conic Angle for Animated Border */
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Fixed Floating Top Navigation with Animated Glowing Border */
    .nav-wrapper {
      position: fixed;
      top: 18px;
      z-index: 9999;
      padding: 2px; /* Border thickness */
      border-radius: 9999px;
      background: conic-gradient(
        from var(--angle),
        transparent 0deg,
        rgba(168, 85, 247, 0.2) 60deg,
        #a855f7 140deg,
        #ec4899 180deg,
        #38bdf8 240deg,
        transparent 310deg
      );
      animation: rotateBorder 4s linear infinite;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
    }

    @keyframes rotateBorder {
      0% {
        --angle: 0deg;
      }
      100% {
        --angle: 360deg;
      }
    }

    .nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(12, 13, 20, 0.88);
      backdrop-filter: blur(20px);
      padding: 6px 10px;
      border-radius: 9999px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 22px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      color: #ffffff;
    }

    /* Active Selected Tab */
    .nav-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(236, 72, 153, 0.25));
      border: 1px solid #a855f7;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
    }

    /* Fullscreen Media Container */
    .display-container {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 80px; /* Space for fixed nav */
      background: #000000;
    }

    /* View Panels */
    .view-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      animation: fadeIn 0.25s ease forwards;
    }

    .view-panel.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Uncropped Full Video Display */
    .full-video {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Uncropped Full Image Display */
    .full-image {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Floating Nav Bar with Rotating Glowing Border -->
  <div class="nav-wrapper">
    <nav class="nav-bar">
      <button class="nav-btn active" id="btn-tiktok" onclick="switchTab('tiktok')">
        <span>📱</span> TikTok
      </button>
      <button class="nav-btn" id="btn-gta" onclick="switchTab('gta')">
        <span>🚗</span> GTA 5
      </button>
    </nav>
  </div>

  <!-- Fullscreen Content Area -->
  <main class="display-container">

    <!-- TikTok Screen Recording View -->
    <div class="view-panel active" id="view-tiktok">
      <video class="full-video" autoplay loop muted playsinline controls>
        <source src="tiktok%20preview.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- GTA 5 Full Screenshot View -->
    <div class="view-panel" id="view-gta">
      <img class="full-image" src="gta-5" alt="GTA 5 Screenshot" />
    </div>

  </main>

  <script>
    function switchTab(tabName) {
      const btnTiktok = document.getElementById('btn-tiktok');
      const btnGta = document.getElementById('btn-gta');
      const viewTiktok = document.getElementById('view-tiktok');
      const viewGta = document.getElementById('view-gta');

      if (tabName === 'tiktok') {
        btnTiktok.classList.add('active');
        btnGta.classList.remove('active');
        viewTiktok.classList.add('active');
        viewGta.classList.remove('active');
      } else {
        btnGta.classList.add('active');
        btnTiktok.classList.remove('active');
        viewGta.classList.add('active');
        viewTiktok.classList.remove('active');
      }
    }
  </script>
</body>
</html>

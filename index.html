<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA 5 & TikTok Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Animated Gradient Angle */
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #08080c;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Background */
    body::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      height: 420px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(236, 72, 153, 0.12) 40%, transparent 70%);
      filter: blur(85px);
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Top Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 18, 26, 0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 9999px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      color: #ffffff;
    }

    /* Active Glowing State */
    .nav-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(236, 72, 153, 0.2));
      border: 1px solid #a855f7;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.5);
    }

    /* Glowing Rotating Border Frame */
    .glow-frame {
      position: relative;
      width: 100%;
      padding: 2.5px;
      border-radius: 24px;
      background: conic-gradient(
        from var(--angle),
        transparent 0deg,
        rgba(168, 85, 247, 0.2) 60deg,
        #a855f7 140deg,
        #ec4899 180deg,
        #06b6d4 240deg,
        transparent 310deg
      );
      animation: rotateBorder 4s linear infinite;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);
    }

    @keyframes rotateBorder {
      0% {
        --angle: 0deg;
      }
      100% {
        --angle: 360deg;
      }
    }

    .glow-frame-content {
      background: #0d0e15;
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 520px;
      width: 100%;
    }

    /* Tab Content Views */
    .view-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeIn 0.3s ease forwards;
    }

    .view-panel.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* TikTok Video Player */
    .video-container {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* GTA 5 Image Display */
    .image-container {
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #151622;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <button class="nav-btn active" id="btn-tiktok" onclick="switchTab('tiktok')">
        <span>📱</span> TikTok
      </button>
      <button class="nav-btn" id="btn-gta" onclick="switchTab('gta')">
        <span>🚗</span> GTA 5
      </button>
    </nav>

    <!-- Animated Glowing Card -->
    <div class="glow-frame">
      <div class="glow-frame-content">

        <!-- TikTok Tab Content (Auto-looping) -->
        <div class="view-panel active" id="view-tiktok">
          <h2 class="panel-title">TikTok Clip</h2>
          <div class="video-container">
            <video autoplay loop muted playsinline controls>
              <source src="tiktok%20preview.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
          </div>
        </div>

        <!-- GTA 5 Tab Content -->
        <div class="view-panel" id="view-gta">
          <h2 class="panel-title">GTA 5 Showcase</h2>
          <div class="image-container">
            <img src="gta-5" alt="GTA 5 Screenshot" />
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    function switchTab(tabName) {
      const btnTiktok = document.getElementById('btn-tiktok');
      const btnGta = document.getElementById('btn-gta');
      const viewTiktok = document.getElementById('view-tiktok');
      const viewGta = document.getElementById('view-gta');

      if (tabName === 'tiktok') {
        btnTiktok.classList.add('active');
        btnGta.classList.remove('active');
        viewTiktok.classList.add('active');
        viewGta.classList.remove('active');
      } else {
        btnGta.classList.add('active');
        btnTiktok.classList.remove('active');
        viewGta.classList.add('active');
        viewTiktok.classList.remove('active');
      }
    }
  </script>
</body>
</html>
